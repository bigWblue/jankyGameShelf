<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Snake</title>
</head>
<body>
    <div id="title-container">
        <span id="game-title">Snake</span>
        <span id="game-score">Best score: <span id="score-count">0</span></span>
        <div id="infinite-container">
            <input type="checkbox" id="infinite-mode-checkbox">
            <label for="infinite-mode-checkbox" id="infinite-label">Infinite Mode</label>
        </div>
        <span id="game-deaths" class="hidden">Deaths: <span id="death-count">0</span></span>
        <div id="back-container">
            <a href="../index.html">
                <button id="back-button">⬅ Go Back</button>
            </a>
        </div>
    </div>
    <canvas id="game" width="600" height="600">Snake</canvas>
    <script src="snakeGame.js"></script>
</body>
</html>
