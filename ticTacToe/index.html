<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="first-container">
        <h1 id="title">Tic-Tac-Toe</h1>
        <div id="checkbox-container">
            <input id="game-mode-checkbox" type="checkbox" checked>
            <label for="game-mode-checkbox" id="game-mode-label">
                <span id="game-mode">Single</span> Player Mode
            </label>
        </div>
        <div id="scores-container">
            <span id="player-score">Player: <span id="player-counter">0</span></span>
            <span id="cpu-score">Computer: <span id="cpu-counter">0</span></span>
        </div>
        <a href="../index.html">
            <button id="back-btn">⬅ Go Back</button>
        </a>
    </div>
    <div id="middle-container">
        <div id="gameboard">
            <div class="square square-0"></div>
            <div class="square square-1"></div>
            <div class="square square-2"></div>
            <div class="square square-3"></div>
            <div class="square square-4"></div>
            <div class="square square-5"></div>
            <div class="square square-6"></div>
            <div class="square square-7"></div>
            <div class="square square-8"></div>
        </div>
        <button id="reset-btn">RESET</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
